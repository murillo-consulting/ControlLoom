  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#bg)" stroke="#2dd4bf" stroke-opacity=".35" stroke-width="2"/>
  <path d="M18 17h18a10 10 0 0 1 10 10v20" fill="none" stroke="url(#thread)" stroke-width="6" stroke-linecap="round"/>
